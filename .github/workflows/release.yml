name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install poetry tomlkit

      - name: Bump version
        id: bump
        run: |
          python3 -c "
          import tomlkit, re

          bump = '${{ inputs.bump }}'

          # Read current version from pyproject.toml
          with open('pyproject.toml') as f:
              doc = tomlkit.load(f)
          current = doc['tool']['poetry']['version']
          major, minor, patch = (int(x) for x in current.split('.'))

          if bump == 'major':
              major, minor, patch = major + 1, 0, 0
          elif bump == 'minor':
              minor, patch = minor + 1, 0
          else:
              patch += 1

          new_version = f'{major}.{minor}.{patch}'

          # Update pyproject.toml
          doc['tool']['poetry']['version'] = new_version
          with open('pyproject.toml', 'w') as f:
              tomlkit.dump(doc, f)

          # Update __init__.py
          init_path = 'pyfahrplan/__init__.py'
          with open(init_path) as f:
              content = f.read()
          content = re.sub(
              r\"__version__\s*=\s*['\\\"].*['\\\"]\",
              f\"__version__ = '{new_version}'\",
              content,
          )
          with open(init_path, 'w') as f:
              f.write(content)

          print(f'Bumped {current} -> {new_version}')

          with open('$GITHUB_OUTPUT', 'a') as f:
              f.write(f'version={new_version}\n')
          "

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml pyfahrplan/__init__.py
          git commit -m "Release v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD --tags

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            --title "v${{ steps.bump.outputs.version }}" \
            --generate-notes
