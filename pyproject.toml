[project]
name = "pyfahrplan"
version = "1.1.0"
description = "A CCC Fahrplan TUI"
authors = [{ name = "Sascha", email = "saschalalala@github.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
keywords = ["cli", "ccc", "calendar", "console"]
dependencies = [
    "textual>=0.40.0",
    "python-dateutil>=2.8.1",
]

[project.urls]
Repository = "https://github.com/saschalalala/pyfahrplan"

[project.scripts]
pyfahrplan = "pyfahrplan.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.11"

[tool.pixi.pypi-dependencies]
pyfahrplan = { path = ".", editable = true }

[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-asyncio = "*"
pytest-cov = "*"

[tool.pixi.feature.test.tasks]
test = "pytest tests/ -v"
coverage = "pytest --cov=pyfahrplan tests/"

[tool.pixi.feature.dev.dependencies]
black = "*"
tomlkit = "*"

[tool.pixi.feature.dev.tasks]
lint = "black --check pyfahrplan/"
format = "black pyfahrplan/"
build-db = "python -m pyfahrplan.build_db"

[tool.pixi.environments]
default = { features = ["test", "dev"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
